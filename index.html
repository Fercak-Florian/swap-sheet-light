<head>
    <link href="https://cdn.jsdelivr.net/npm/boosted@5.3.8/dist/css/boosted.min.css" rel="stylesheet"
        integrity="sha384-kwpgedOHSHo219WTezLqyMOgCWremFb5TML711U5X8c4TJMMBAyhHFf2gNv78IpY" crossorigin="anonymous">
    <!-- <link href="styles.css" rel="stylesheet" /> -->

    <script src="https://cdn.jsdelivr.net/npm/boosted@5.3.8/dist/js/boosted.bundle.min.js"
        integrity="sha384-lSjE7ZAWc1Wiua5r2jyHbPL07FiKkHPWCXugD3qTq4o4M4YZQzLTrDF1CXrjxU/m" crossorigin="anonymous">
        </script>
</head>

<body class="mx-4">
    <div>
        <header class="fs-1 d-flex justify-content-center my-4">
            Fiche de suivi 26E
        </header>

        <section class="d-flex justify-content-between my-4">
            <div class="">
                <div class="d-flex me-4">
                    <label for="symptom" class="py-2 me-2">
                        Taille Disque :
                    </label>
                    <div class="d-flex justify-content-center">
                        <input type="text" class="border-0" id="symptom" placeholder="" value="">
                    </div>
                </div>
                <div class="d-flex me-4">
                    <label for="symptom" class="py-2 me-2">
                        Modèle :
                    </label>
                    <div class="d-flex justify-content-center">
                        <input type="text" class="border-0" id="symptom" placeholder="" value="">
                    </div>
                </div>
            </div>

            <div class="">
                <div class="d-flex me-4">
                    <label for="symptom" class="py-2 me-2">
                        BIOS :
                    </label>
                    <div class="d-flex justify-content-center">
                        <input type="text" class="border-0" id="symptom" placeholder="" value="">
                    </div>
                </div>
                <div class="d-flex mb-3 align-items-center">
                    <label for="returnDate" class="col-form-label">
                        Date Master :
                    </label>
                    <div class="">
                        <input type="date" class="form-control border-0" id="returnDate" name="dateDebut">
                    </div>
                </div>
            </div>
        </section>

        <div class="d-flex mb-3 align-items-center border">
            <label for="newComputerTattoo" class="ps-2 col-form-label">
                N° de Tatouage :
            </label>
            <div class="col-sm-9">
                <input type="text" class="form-control border border-0" id="newComputerTattoo" placeholder=""
                    value="OR">
            </div>
        </div>
        <div class="d-flex mb-3 align-items-center border">
            <label for="tspName" class="px-2 text-nowrap">
                Nom du TSP :
            </label>
            <select class="form-select" aria-label="Default select example">
                <option selected>Selectionnez un TSP</option>
                <option value="1">HADJ MESSAOUD Alain</option>
                <option value="2">LACOUR Vincent</option>
                <option value="3">FERCAK Florian</option>
                <option value="4">FERCAK Florian</option>
                <option value="5">FERCAK Florian</option>
                <option value="6">BOUYASSINE Rayan</option>
                <option value="7">SOUMBOU Jeansi</option>
            </select>
        </div>
        <div class="mb-3 border py-2">
            <div class="d-flex align-items-center">
                <label for="newComputerTattoo" class="ps-2 text-nowrap">
                    Utilisateur :
                </label>
                <div class="">
                    <input type="text" class="form-control border-0" id="newComputerTattoo" placeholder="" value="">
                </div>
            </div>
            <div class="d-flex align-items-center">
                <label for="newComputerTattoo" class="ps-2 form-label text-nowrap">
                    Code Ident :
                </label>
                <div class="">
                    <input type="text" class="form-control border-0" id="newComputerTattoo" placeholder="" value="">
                </div>
            </div>
        </div>
        <div class="d-flex mb-3 align-items-center border">
            <label for="newComputerTattoo" class="ps-2 col-form-label">
                N° INC / MYI :
            </label>
            <div class="">
                <input type="text" class="form-control border border-0" id="newComputerTattoo" placeholder="" value="">
            </div>
        </div>

        <div class="d-flex mb-3 align-items-center border">
            <label for="returnDate" class="ps-2 col-form-label">
                Date de remise :
            </label>

            <div class="">
                <input type="date" class="form-control border-0" id="returnDate" name="dateDebut">
            </div>
        </div>

        <footer class="">
            <div class="d-flex justify-content-end me-4">
                <label for="oldTattooComputer" class="py-2 me-2">
                    Ancien PC :
                </label>
                <div class="d-flex justify-content-center">
                    <input type="text" class="" id="oldTattooComputer" placeholder="" value="OR">
                </div>
            </div>
            <div class="d-flex justify-content-end me-4">
                <label for="model" class="py-2 me-2">
                    Modèle :
                </label>
                <div class="d-flex justify-content-center">
                    <input type="text" class="" id="model" placeholder="" value="">
                </div>
            </div>
            <div class="d-flex justify-content-end me-4">
                <label for="symptom" class="py-2 me-2">
                    Symptôme :
                </label>
                <div class="mb-3">
                    <textarea class="form-control" id="symptom" rows="3"></textarea>
                </div>
            </div>
        </footer>
    </div>
</body>
